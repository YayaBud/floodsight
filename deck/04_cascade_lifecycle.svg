<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 880" width="1520" height="880" role="img" aria-label="Cascade failure lifecycle: inflow raises an upstream pool, a per-timestep trigger opens a breach, discharge is measured at the opening, routed downstream, and can trigger a second breach at the next structure">

  <text x="40" y="46" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1B2D">A cascade is not one dam failing. It is one dam failing into another.</text>
  <text x="40" y="74" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#475569">Pincha into Annamayya, 2021. South Lhonak into Chungthang, 2023. The second failure is the one that kills.</text>

  <!-- ===== trigger retry loop ===== -->
  <polyline points="760,163 760,122 450,122 450,170" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="443,170 457,170 450,184" fill="#94A3B8"/>
  <text x="605" y="114" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#475569" text-anchor="middle">NO &#8212; the pool keeps rising, test again next timestep</text>

  <!-- ===== ROW A ===== -->
  <rect x="40" y="170" width="230" height="130" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="62" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1B2D">Catchment inflow</text>
  <text x="62" y="232" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F6BFF">I(t)</text>
  <text x="62" y="256" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">storm runoff, or the</text>
  <text x="62" y="274" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">surge from whatever</text>
  <text x="62" y="292" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">failed further up</text>

  <line x1="270" y1="235" x2="296" y2="235" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="296,228 310,235 296,242" fill="#94A3B8"/>

  <rect x="310" y="170" width="280" height="130" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="332" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1B2D">Upstream impoundment</text>
  <text x="332" y="232" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2F6BFF">dS/dt = I &#8722; Q spill(h) &#8722; Q breach(h)</text>
  <text x="332" y="256" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">level-pool continuity on the</text>
  <text x="332" y="274" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">terrain-derived V(h) curve &#8212; one</text>
  <text x="332" y="292" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">integrator, never reinitialised</text>

  <line x1="590" y1="235" x2="616" y2="235" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="616,228 630,235 616,242" fill="#94A3B8"/>

  <polygon points="760,163 890,235 760,307 630,235" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text x="760" y="226" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2F6BFF" text-anchor="middle">Trigger test</text>
  <text x="760" y="248" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">water level vs crest,</text>
  <text x="760" y="265" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">by failure mechanism</text>

  <line x1="890" y1="235" x2="916" y2="235" stroke="#DC2626" stroke-width="2.5"/>
  <polygon points="916,228 930,235 916,242" fill="#DC2626"/>
  <text x="903" y="222" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">YES</text>

  <rect x="930" y="170" width="250" height="130" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="952" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B91C1C">Breach opens</text>
  <text x="952" y="232" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">a trapezoidal cut widens</text>
  <text x="952" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">and erodes downward</text>
  <text x="952" y="274" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">through the barrier in the</text>
  <text x="952" y="292" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">solver&#8217;s own terrain</text>

  <line x1="1180" y1="235" x2="1206" y2="235" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="1206,228 1220,235 1206,242" fill="#94A3B8"/>

  <rect x="1220" y="170" width="260" height="130" rx="9" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="1242" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">Discharge Q(t)</text>
  <text x="1242" y="232" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">measured at the opening</text>
  <text x="1242" y="256" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">the pool drains through a</text>
  <text x="1242" y="274" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">real hole. Q is an output of</text>
  <text x="1242" y="292" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">the run, not an input to it.</text>

  <!-- ===== routed bus down to row B ===== -->
  <polyline points="1350,300 1350,382 165,382 165,436" fill="none" stroke="#2F6BFF" stroke-width="2.5"/>
  <polygon points="158,436 172,436 165,450" fill="#2F6BFF"/>
  <text x="757" y="374" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#2F6BFF" text-anchor="middle">outflow hydrograph with its three-arm confidence band</text>

  <!-- ===== ROW B ===== -->
  <rect x="40" y="450" width="250" height="130" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="62" y="486" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1B2D">Reach routing</text>
  <text x="62" y="512" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2F6BFF">S = K[xI + (1&#8722;x)Q]</text>
  <text x="62" y="536" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">Muskingum transport down</text>
  <text x="62" y="554" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">the river to the next</text>
  <text x="62" y="572" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">structure, attenuated</text>

  <line x1="290" y1="515" x2="316" y2="515" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="316,508 330,515 316,522" fill="#94A3B8"/>

  <rect x="330" y="450" width="270" height="130" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="352" y="486" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1B2D">Downstream reservoir</text>
  <text x="352" y="512" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">the surge arrives on top of</text>
  <text x="352" y="530" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">whatever it was already</text>
  <text x="352" y="548" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">holding; its own spillway</text>
  <text x="352" y="566" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">tries to pass it</text>

  <line x1="600" y1="515" x2="626" y2="515" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="626,508 640,515 626,522" fill="#94A3B8"/>

  <polygon points="760,443 890,515 760,587 630,515" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text x="760" y="506" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2F6BFF" text-anchor="middle">Capacity</text>
  <text x="760" y="526" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2F6BFF" text-anchor="middle">exceeded?</text>

  <line x1="890" y1="515" x2="916" y2="515" stroke="#DC2626" stroke-width="2.5"/>
  <polygon points="916,508 930,515 916,522" fill="#DC2626"/>
  <text x="903" y="502" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">YES</text>

  <rect x="930" y="450" width="250" height="130" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="952" y="486" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B91C1C">Second breach</text>
  <text x="952" y="512" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">same kernel, same trigger</text>
  <text x="952" y="530" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">logic, new structure &#8212; the</text>
  <text x="952" y="548" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">failure nobody planned for,</text>
  <text x="952" y="566" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7F1D1D">because it needed the first</text>

  <!-- NO branch from capacity check -->
  <polyline points="760,587 760,650" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="776" y="622" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">NO &#8212; the spillway passes it</text>
  <polyline points="1055,580 1055,650 760,650 760,690" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="753,690 767,690 760,704" fill="#94A3B8"/>

  <!-- ===== SOLVER ===== -->
  <rect x="430" y="704" width="660" height="110" rx="10" fill="#1E3A8A"/>
  <text x="760" y="742" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2D shallow-water domain &#8212; one combined hydrograph</text>
  <text x="760" y="768" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#DBEAFE" text-anchor="middle">every downstream village is hit by the sum of both failures, arriving at different times</text>
  <text x="760" y="792" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#DBEAFE" text-anchor="middle">out: depth rasters, road cut times, evacuation windows, ranked settlements</text>

  <!-- ===== side notes ===== -->
  <rect x="40" y="704" width="360" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="62" y="734" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#64748B">NO SCRIPTED FAILURE TIME</text>
  <text x="62" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">The breach happens when the physics</text>
  <text x="62" y="776" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">says it happens. Both trigger tests are</text>
  <text x="62" y="794" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">re-evaluated every single timestep.</text>

  <rect x="1120" y="704" width="360" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1142" y="734" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#64748B">MASS IS COUNTED ONCE</text>
  <text x="1142" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">Water leaves through the opening or it</text>
  <text x="1142" y="776" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">stays in the pool. Supplying both an</text>
  <text x="1142" y="794" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">opening and an inflow raises an error.</text>
</svg>
